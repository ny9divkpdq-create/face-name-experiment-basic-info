<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顔と名前の記憶実験（趣味・出身地グループ）</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f7f7f7;color:#111;text-align:center;font-family:system-ui,"Yu Gothic",Meiryo,sans-serif}
main{max-width:720px;margin:auto;padding:clamp(16px,4vw,32px);background:white;border-radius:14px}
h1{font-size:clamp(1.4rem,4vw,1.8rem)}p{line-height:1.7}.field{max-width:420px;margin:14px auto;text-align:left}label{display:block;font-weight:bold;margin-bottom:6px}
input{width:100%;padding:12px;font-size:1rem;border:1px solid #aaa;border-radius:8px}
button{margin-top:16px;padding:12px 24px;background:#1769aa;color:white;border:0;border-radius:8px;font-size:1rem;font-weight:bold}
.face{width:min(300px,78vw);height:min(300px,78vw);object-fit:cover;border:1px solid #ddd}
.counter{font-size:1.1rem}.person-name{font-size:clamp(1.5rem,5vw,2rem);font-weight:800;margin:18px 0 12px}.info{font-size:clamp(1.3rem,4vw,1.55rem);font-weight:800;margin:12px 0;line-height:1.6}
.hidden{display:none!important}.note,.status{color:#444;font-size:.95rem}
</style>
</head>
<body><main>
<section id="start-screen">
<h1>顔と名前の記憶実験</h1><h2>趣味・出身地グループ</h2>
<p>これから10人の顔写真・名前・趣味・出身地を順番に見てもらいます。<br>1人につき20秒間表示されます。よく見て覚えてください。<br>その後、顔写真を見て名前を答えるテストを行います。</p>
<div class="field"><label for="student-number">学籍番号</label><input id="student-number" type="text" placeholder="例：5401" autocomplete="off"><p class="note">入力例：5年4組1番 → 5401</p></div>
<div class="field"><label for="student-name">参加者名</label><input id="student-name" type="text" autocomplete="name"></div>
<button id="start-button">実験開始</button><p id="start-status" class="status"></p>
</section>
<section id="study-screen" class="hidden">
<p id="study-counter" class="counter">人物 1 / 10</p><img id="study-face" class="face" src="images/person01.jpg" alt="人物の顔写真">
<div id="study-name" class="person-name"></div><p id="study-hobby" class="info"></p><p id="study-origin" class="info"></p><p id="study-timer"></p>
</section>
<section id="test-screen" class="hidden">
<h1>名前のテスト</h1><p>写真の人物の名前を入力してください。<br>フルネームが思い出せない場合は、覚えている部分だけでも入力してください。</p>
<p id="test-counter" class="counter"></p><img id="test-face" class="face" src="images/person01.jpg" alt="名前を答える人物の顔写真">
<div class="field"><label for="answer">この人物の名前</label><input id="answer" type="text" autocomplete="off" placeholder="覚えている名前を入力"></div>
<button id="next-button">次へ</button><p id="test-status" class="status"></p>
</section>
<section id="finish-screen" class="hidden"><h1>実験終了</h1><p>回答ありがとうございました。</p><p id="save-status" class="status">回答データを送信しています。</p></section>
</main>
<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwZbGbsraM6rRquxFgTEMJJwm_dJtQjCxIqudXlMOmXE-hj7M4x3exzfX6Zgn5t8qhh8w/exec";
const people = [
{id:"01",name:"岡田 綾乃",hobby:"読書",origin:"長野県",image:"images/person01.jpg"},
{id:"02",name:"林 美穂",hobby:"写真撮影",origin:"福岡県",image:"images/person02.jpg"},
{id:"03",name:"加藤 達也",hobby:"サッカー",origin:"静岡県",image:"images/person03.jpg"},
{id:"04",name:"増田 正樹",hobby:"料理",origin:"北海道",image:"images/person04.jpg"},
{id:"05",name:"笠原 光",hobby:"映画鑑賞",origin:"岡山県",image:"images/person05.jpg"},
{id:"06",name:"本田 健司",hobby:"ゲーム",origin:"鹿児島県",image:"images/person06.jpg"},
{id:"07",name:"鈴木 千鶴",hobby:"絵を描くこと",origin:"宮城県",image:"images/person07.jpg"},
{id:"08",name:"浅野 俊彦",hobby:"音楽鑑賞",origin:"香川県",image:"images/person08.jpg"},
{id:"09",name:"原 裕子",hobby:"旅行",origin:"石川県",image:"images/person09.jpg"},
{id:"10",name:"須貝 みゆき",hobby:"ガーデニング",origin:"熊本県",image:"images/person10.jpg"}];
const $=id=>document.getElementById(id);let studentNumber="",studentName="",studyIndex=0,testIndex=0,answers=[],timer=null;
function showOnly(id){["start-screen","study-screen","test-screen","finish-screen"].forEach(s=>$(s).classList.toggle("hidden",s!==id))}
function showStudy(){const p=people[studyIndex];$("study-counter").textContent=`人物 ${studyIndex+1} / 10`;$("study-face").src=p.image;$("study-name").textContent=p.name;$("study-hobby").textContent="趣味："+p.hobby;$("study-origin").textContent="出身地："+p.origin;let left=20;$("study-timer").textContent="次の人物まで："+left+"秒";if(timer)clearInterval(timer);timer=setInterval(()=>{left--;$("study-timer").textContent="次の人物まで："+left+"秒";if(left<=0){clearInterval(timer);timer=null;studyIndex++;if(studyIndex<people.length)showStudy();else startTest()}},1000)}
function startTest(){showOnly("test-screen");testIndex=0;showTest()}
function showTest(){const p=people[testIndex];$("test-counter").textContent=`人物 ${testIndex+1} / 10`;$("test-face").src=p.image;$("answer").value="";$("next-button").textContent=testIndex===9?"回答を送信して終了":"次へ";$("answer").focus()}
$("start-button").onclick=()=>{studentNumber=$("student-number").value.trim();studentName=$("student-name").value.trim();if(!studentNumber||!studentName){alert("学籍番号と名前を入力してください。");return}if(WEB_APP_URL==="PASTE_YOUR_WEB_APP_URL_HERE"){alert("送信先URLがまだ設定されていません。スプレッドシートの準備後に設定します。");return}studyIndex=0;showOnly("study-screen");showStudy()};
$("next-button").onclick=async()=>{answers.push($("answer").value.trim());if(testIndex<9){testIndex++;showTest();return}showOnly("finish-screen");const rows=answers.map((answer,i)=>({timestamp:new Date().toISOString(),studentNumber,studentName,personNumber:i+1,personId:people[i].id,correctName:people[i].name,answer,hobby:people[i].hobby,origin:people[i].origin}));try{await fetch(WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({condition:"趣味・出身地",rows})});$("save-status").textContent="回答データの送信処理を行いました。ご協力ありがとうございました。"}catch(e){$("save-status").textContent="回答の送信に失敗した可能性があります。実験担当者に知らせてください。"}};
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")$("next-button").click()});
</script></body></html>
